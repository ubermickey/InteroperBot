<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InteroperBot Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --blue: #58a6ff;
    --green: #3fb950;
    --user-bg: #1f6feb;
    --assistant-bg: #21262d;
    --input-bg: #0d1117;
    --radius: 16px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  body {
    display: flex;
    flex-direction: column;
    max-width: 800px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .header h1 {
    font-size: 16px;
    font-weight: 600;
  }

  .header-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.2s;
  }

  .clear-btn:hover {
    border-color: var(--text-muted);
    color: var(--text);
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .message {
    max-width: 75%;
    padding: 10px 16px;
    border-radius: var(--radius);
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    align-self: flex-end;
    background: var(--user-bg);
    border-bottom-right-radius: 4px;
  }

  .message.assistant {
    align-self: flex-start;
    background: var(--assistant-bg);
    border-bottom-left-radius: 4px;
  }

  /* Typing indicator */
  .typing {
    align-self: flex-start;
    background: var(--assistant-bg);
    padding: 12px 20px;
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
    display: none;
    gap: 5px;
    margin: 0 20px;
  }

  .typing.active { display: flex; }

  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.4s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    gap: 8px;
    padding: 40px;
  }

  .empty-icon {
    font-size: 40px;
    margin-bottom: 8px;
    opacity: 0.4;
  }

  .empty-state p {
    font-size: 14px;
    text-align: center;
  }

  /* Input */
  .input-area {
    padding: 12px 20px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-row textarea {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 12px 16px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.4;
    resize: none;
    outline: none;
    max-height: 120px;
    transition: border-color 0.2s;
  }

  .input-row textarea:focus {
    border-color: var(--blue);
  }

  .input-row textarea::placeholder {
    color: var(--text-muted);
  }

  .send-btn {
    background: var(--blue);
    border: none;
    border-radius: 12px;
    color: #fff;
    width: 44px;
    height: 44px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }

  .send-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .send-btn:not(:disabled):hover {
    opacity: 0.85;
  }

  .send-btn svg {
    width: 20px;
    height: 20px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="header-dot"></div>
      <div>
        <h1>InteroperBot</h1>
        <div class="header-sub">Claude-powered chat</div>
      </div>
    </div>
    <button class="clear-btn" onclick="clearChat()">Clear</button>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">&#x1F4AC;</div>
      <p>Send a message to start chatting with Claude</p>
    </div>
  </div>

  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Type a message..."
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const typingEl = document.getElementById('typing');
const emptyState = document.getElementById('emptyState');
let busy = false;

inputEl.addEventListener('input', () => {
  sendBtn.disabled = !inputEl.value.trim() || busy;
});

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function addMessage(role, text) {
  const es = document.getElementById('emptyState');
  if (es) es.remove();
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function createEmptyState() {
  const container = document.createElement('div');
  container.className = 'empty-state';
  container.id = 'emptyState';
  const icon = document.createElement('div');
  icon.className = 'empty-icon';
  icon.textContent = '\u{1F4AC}';
  const p = document.createElement('p');
  p.textContent = 'Send a message to start chatting with Claude';
  container.appendChild(icon);
  container.appendChild(p);
  return container;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  busy = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  addMessage('user', text);
  typingEl.classList.add('active');
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    typingEl.classList.remove('active');

    if (data.error) {
      addMessage('assistant', 'Error: ' + data.error);
    } else {
      addMessage('assistant', data.reply);
    }
  } catch (err) {
    typingEl.classList.remove('active');
    addMessage('assistant', 'Connection error. Is the server running?');
  }

  busy = false;
  sendBtn.disabled = !inputEl.value.trim();
  inputEl.focus();
}

async function clearChat() {
  if (!confirm('Clear conversation history?')) return;
  try {
    await fetch('/api/clear', { method: 'POST' });
    while (messagesEl.firstChild) messagesEl.removeChild(messagesEl.firstChild);
    messagesEl.appendChild(createEmptyState());
  } catch (err) {
    // Silently fail — user can see the messages are still there
  }
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const messages = await res.json();
    if (messages.length > 0) {
      messages.forEach(m => addMessage(m.role, m.content));
    }
  } catch (err) {
    // Server not ready yet
  }
}

loadHistory();
inputEl.focus();
</script>
</body>
</html>
