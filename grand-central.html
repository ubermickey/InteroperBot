<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Central Messaging — Train Yard Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;
  --green:#3fb950;--yellow:#d29922;--red:#f85149;
  --orange:#d18616;--purple:#bc8cff;
}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;overflow-x:hidden}

/* ── Station Header ─────────────────────────── */
.station-header{
  background:linear-gradient(180deg,#1a1208 0%,#0d1117 100%);
  border-bottom:3px solid #4a3728;padding:16px 24px;
  display:flex;align-items:center;gap:20px;position:relative;
}
.station-header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 8px,transparent 8px 16px);
}
.marquee{font-size:28px;font-weight:bold;letter-spacing:4px;text-transform:uppercase;
  color:var(--yellow);text-shadow:0 0 20px #d2992266;flex:1}
.marquee small{font-size:12px;color:var(--dim);letter-spacing:1px;display:block;margin-top:2px}
.station-clock{font-size:22px;color:var(--green);font-variant-numeric:tabular-nums;
  border:2px solid var(--border);border-radius:8px;padding:6px 14px;background:#0d1117cc;min-width:100px;text-align:center}
.weather-info{font-size:11px;color:var(--dim);text-align:right;min-width:120px}
.weather-info .temp{font-size:18px;color:var(--text)}
.status-lights{display:flex;gap:8px;align-items:center}
.light{width:12px;height:12px;border-radius:50%;border:1px solid #0008}
.light.green{background:var(--green);box-shadow:0 0 8px var(--green)}
.light.yellow{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.light.red{background:var(--red);box-shadow:0 0 8px var(--red)}
.light.off{background:#333;box-shadow:none}

/* ── Layout ─────────────────────────────────── */
.yard-container{display:flex;flex-direction:column;height:calc(100vh - 80px)}
.canvas-wrap{flex:1;min-height:300px;position:relative;overflow:hidden}
.canvas-wrap canvas{display:block;width:100%;height:100%}

/* ── Bottom Panels ──────────────────────────── */
.panels{display:grid;grid-template-columns:2fr 1fr;gap:1px;background:var(--border);max-height:260px;overflow:hidden}
.panel{background:var(--surface);padding:12px 16px;overflow-y:auto}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px}

/* ── Schedule Board ─────────────────────────── */
.schedule-table{width:100%;border-collapse:collapse;font-size:12px}
.schedule-table th{text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:4px 8px;border-bottom:1px solid var(--border)}
.schedule-table td{padding:5px 8px;border-bottom:1px solid #30363d22}
.dir-arriving{color:var(--green)}
.dir-departing{color:var(--accent)}
.flip-cell{display:inline-block;background:#111;padding:2px 6px;border-radius:2px;font-family:'Courier New',monospace;min-width:60px;border-top:1px solid #333;border-bottom:1px solid #000}

/* ── Maintenance Panel ──────────────────────── */
.maint-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.maint-stat{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center}
.maint-stat .value{font-size:24px;font-weight:bold;color:var(--yellow)}
.maint-stat .label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.session-list{margin-top:10px;font-size:11px}
.session-item{padding:4px 8px;margin-bottom:3px;background:var(--bg);border-left:3px solid var(--green);border-radius:0 4px 4px 0}
.pending-item{border-left-color:var(--orange)}
.no-data{color:var(--dim);font-style:italic;font-size:11px;text-align:center;padding:20px}
</style>
</head>
<body>

<header class="station-header">
  <div class="marquee">
    Grand Central Messaging
    <small>InteroperBot Train Yard Dashboard</small>
  </div>
  <div class="status-lights">
    <div class="light green" id="light-api" title="API"></div>
    <div class="light off" id="light-ai" title="AI Sessions"></div>
    <div class="light off" id="light-pending" title="Pending"></div>
  </div>
  <div class="weather-info" id="weather-info">
    <div class="temp" id="weather-temp">--°</div>
    <div id="weather-desc">Loading weather…</div>
  </div>
  <div class="station-clock" id="clock">--:--:--</div>
</header>

<div class="yard-container">
  <div class="canvas-wrap">
    <canvas id="yard"></canvas>
  </div>
  <div class="panels">
    <div class="panel" id="schedule-panel">
      <h3>Train Schedule</h3>
      <table class="schedule-table">
        <thead><tr><th>Contact</th><th>Last Message</th><th>Dir</th><th>Time</th><th>Msgs</th></tr></thead>
        <tbody id="schedule-body"></tbody>
      </table>
      <div class="no-data" id="schedule-empty">No conversations yet — send a message to lay the first track</div>
    </div>
    <div class="panel" id="maint-panel">
      <h3>Roundhouse — AI Maintenance</h3>
      <div class="maint-grid">
        <div class="maint-stat"><div class="value" id="stat-sessions">0</div><div class="label">Active Sessions</div></div>
        <div class="maint-stat"><div class="value" id="stat-pending">0</div><div class="label">Pending Deliveries</div></div>
        <div class="maint-stat"><div class="value" id="stat-messages">0</div><div class="label">Total Messages</div></div>
        <div class="maint-stat"><div class="value" id="stat-contacts">0</div><div class="label">Tracks</div></div>
      </div>
      <div class="session-list" id="session-list"></div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  GRAND CENTRAL MESSAGING — Train Yard Engine
// ══════════════════════════════════════════════

// ── State ───────────────────────────────────
let tracks = [];
let schedule = [];
let maintenance = {};
let trainAnimations = [];
let particles = [];
let frameCount = 0;
let weather = { temp: null, code: 0, description: '', isDay: true };

const canvas = document.getElementById('yard');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const wrap = canvas.parentElement;
  canvas.width = W = wrap.clientWidth;
  canvas.height = H = wrap.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// ── Clock ───────────────────────────────────
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-US', { hour12: false });
}
setInterval(updateClock, 1000);
updateClock();

// ══════════════════════════════════════════════
//  WEATHER SYSTEM — Open-Meteo (free, no key)
// ══════════════════════════════════════════════
// WMO Weather interpretation codes → description + visual effects
const WMO_CODES = {
  0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
  45:'Foggy',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',
  56:'Freezing drizzle',57:'Dense freezing drizzle',
  61:'Slight rain',63:'Rain',65:'Heavy rain',
  66:'Freezing rain',67:'Heavy freezing rain',
  71:'Slight snow',73:'Snow',75:'Heavy snow',77:'Snow grains',
  80:'Slight showers',81:'Showers',82:'Violent showers',
  85:'Slight snow showers',86:'Heavy snow showers',
  95:'Thunderstorm',96:'Thunderstorm w/ hail',99:'Thunderstorm w/ heavy hail',
};

async function fetchWeather() {
  try {
    // Los Angeles default — you can change coords
    const r = await fetch(
      'https://api.open-meteo.com/v1/forecast?latitude=34.05&longitude=-118.24&current=temperature_2m,weather_code,is_day&temperature_unit=fahrenheit&timezone=America/Los_Angeles'
    );
    const d = await r.json();
    const c = d.current;
    weather.temp = Math.round(c.temperature_2m);
    weather.code = c.weather_code;
    weather.description = WMO_CODES[c.weather_code] || 'Unknown';
    weather.isDay = c.is_day === 1;
    document.getElementById('weather-temp').textContent = weather.temp + '°F';
    document.getElementById('weather-desc').textContent = weather.description;
  } catch (e) {
    document.getElementById('weather-desc').textContent = 'Weather unavailable';
  }
}
fetchWeather();
setInterval(fetchWeather, 600000); // refresh every 10 min

// ══════════════════════════════════════════════
//  PIXEL ART SPRITE ENGINE — Real Train Models
//  Based on: NYC J-3a Hudson, Burlington Zephyr,
//  PRR GG1, and classic 4-6-2 Pacific
// ══════════════════════════════════════════════

const PX = 3;

// Helper: draw a filled pixel-art rectangle
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w * PX, h * PX);
}

// Helper: single pixel
function dot(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), PX, PX);
}

// ─── NYC J-3a Hudson (20th Century Limited) ─────
// Art Deco streamlined steam loco, Henry Dreyfuss design
// Distinctive: bullet nose shroud, art deco striping, smooth cladding
function drawHudson(bx, by, dir) {
  const s = PX, f = dir === 1 ? 1 : -1;
  const ox = dir === 1 ? bx : bx; // origin

  // ── Streamlined shroud (bullet nose) ──
  // The J-3a had a distinctive smooth casing over the boiler
  px(ox + 3*s*f, by - 10*s, 1, 2, '#2a2a2a');   // nose tip
  px(ox + 4*s*f, by - 11*s, 1, 4, '#333');
  px(ox + 5*s*f, by - 12*s, 2, 5, '#383838');
  // Main boiler cladding
  px(ox + 7*s*f, by - 13*s, 14, 1, '#3a3a3a');  // top fairing
  px(ox + 7*s*f, by - 12*s, 14, 8, '#333');      // main body
  // Art Deco horizontal speed lines (Dreyfuss signature)
  px(ox + 5*s*f, by - 9*s, 16, 1, '#c9a84c');    // gold line
  px(ox + 5*s*f, by - 7*s, 16, 1, '#8a7340');    // darker gold
  px(ox + 5*s*f, by - 5*s, 16, 1, '#555');       // silver line
  // Smokebox / front plate with number plate
  px(ox + 3*s*f, by - 9*s, 2, 4, '#222');
  dot(ox + 3*s*f, by - 10*s, '#c9a84c');          // number plate
  // Headlight (Mars oscillating light was famous on these)
  dot(ox + 3*s*f, by - 11*s, '#ffe066');
  if (frameCount % 20 < 10) dot(ox + 2*s*f, by - 11*s, '#fff8cc44'); // glow pulse

  // ── Cab (enclosed, Art Deco profile) ──
  px(ox + 21*s*f, by - 13*s, 6, 1, '#2d2d2d');   // cab roof overhang
  px(ox + 21*s*f, by - 12*s, 6, 8, '#2a2a2a');   // cab body
  px(ox + 22*s*f, by - 11*s, 2, 3, '#4a6fa5');    // side window
  px(ox + 25*s*f, by - 11*s, 1, 3, '#4a6fa5');    // rear window
  // Cab interior warm glow
  px(ox + 22*s*f, by - 10*s, 2, 1, '#ff9900');
  // Gold cab trim
  px(ox + 21*s*f, by - 6*s, 6, 1, '#c9a84c');

  // ── Tender (water + coal car, also streamlined) ──
  px(ox + 27*s*f, by - 11*s, 10, 7, '#2d2d2d');
  px(ox + 27*s*f, by - 12*s, 10, 1, '#333');     // tender top
  px(ox + 27*s*f, by - 8*s, 10, 1, '#c9a84c');   // gold stripe continues
  // NYC oval herald
  dot(ox + 31*s*f, by - 9*s, '#e8e8e8');
  dot(ox + 32*s*f, by - 9*s, '#e8e8e8');

  // ── Smokestack (shorter on streamlined version) ──
  px(ox + 8*s*f, by - 15*s, 2, 2, '#222');
  px(ox + 7*s*f, by - 16*s, 4, 1, '#333');        // cap

  // ── Running gear & wheels ──
  // Pilot truck (2 wheels)
  px(ox + 4*s*f, by - 2*s, 20, 1, '#444');        // frame
  drawWheel(ox + 5*s*f, by);
  drawWheel(ox + 8*s*f, by);
  // Drivers (3 pairs — the "Hudson" arrangement: 4-6-4)
  drawDriver(ox + 11*s*f, by, 0);
  drawDriver(ox + 15*s*f, by, 1);
  drawDriver(ox + 19*s*f, by, 2);
  // Trailing truck (2 wheels)
  drawWheel(ox + 23*s*f, by);
  drawWheel(ox + 25*s*f, by);
  // Tender wheels
  drawWheel(ox + 28*s*f, by);
  drawWheel(ox + 31*s*f, by);
  drawWheel(ox + 34*s*f, by);
  drawWheel(ox + 36*s*f, by);

  // ── Connecting rods (animated) ──
  const rodPhase = Math.sin(frameCount * 0.08) * 1.5;
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(ox + 11*s*f + rodPhase, by + s);
  ctx.lineTo(ox + 19*s*f + rodPhase, by + s);
  ctx.stroke();

  // Valve gear crosshead
  dot(ox + (10 + rodPhase/s)*s*f, by, '#aaa');

  return 37 * s;
}

// ── Burlington Zephyr (Pioneer Zephyr CB&Q 9900) ───
// First diesel streamliner, stainless steel, shovel nose
function drawZephyr(bx, by, dir) {
  const s = PX, f = dir === 1 ? 1 : -1;

  // ── Shovel nose (distinctive angled front) ──
  px(bx + 1*s*f, by - 6*s, 1, 3, '#b0b0b0');
  px(bx + 2*s*f, by - 8*s, 1, 5, '#c0c0c0');
  px(bx + 3*s*f, by - 9*s, 1, 6, '#c8c8c8');
  px(bx + 4*s*f, by - 10*s, 2, 7, '#d0d0d0');
  // Windshield (raked)
  px(bx + 3*s*f, by - 9*s, 2, 2, '#1a3a5c');
  // Main body — stainless steel fluted panels
  px(bx + 6*s*f, by - 10*s, 20, 8, '#c8c8c8');
  // Fluting effect (horizontal corrugation — signature look)
  for (let i = 0; i < 7; i++) {
    px(bx + 6*s*f, by - (10 - i)*s, 20, 1, i % 2 === 0 ? '#d0d0d0' : '#b8b8b8');
  }
  // Red letterboard stripe (Burlington Route)
  px(bx + 4*s*f, by - 5*s, 22, 1, '#cc2200');
  // Vestibule windows
  for (let i = 0; i < 7; i++) {
    px(bx + (7 + i*2.5)*s*f, by - 9*s, 1.5, 2, '#2a5080');
  }
  // Roof (streamlined, rounded)
  px(bx + 6*s*f, by - 11*s, 20, 1, '#aaa');
  // Headlight
  dot(bx + 1*s*f, by - 7*s, '#ffe066');
  // Skirting (covered wheels — very streamlined)
  px(bx + 4*s*f, by - 2*s, 22, 2, '#b0b0b0');
  // Wheels (barely visible under skirt)
  drawWheel(bx + 6*s*f, by + s);
  drawWheel(bx + 12*s*f, by + s);
  drawWheel(bx + 18*s*f, by + s);
  drawWheel(bx + 24*s*f, by + s);
  // Rear
  px(bx + 26*s*f, by - 10*s, 1, 8, '#b0b0b0');
  // "BURLINGTON ROUTE" text area
  ctx.fillStyle = '#222';
  ctx.font = '7px Courier New';
  ctx.fillText('ZEPHYR', bx + 10*s*f, by - 6*s);

  return 27 * s;
}

// ── PRR GG1 Electric (Raymond Loewy design) ─────
// Welded body, pin-striping, distinctive cat-whisker striping
function drawGG1(bx, by, dir) {
  const s = PX, f = dir === 1 ? 1 : -1;

  // GG1's distinctive symmetrical body — same from both ends
  // Rounded nose
  px(bx + 1*s*f, by - 7*s, 1, 4, '#2a3a1a');
  px(bx + 2*s*f, by - 9*s, 1, 6, '#2d4020');
  px(bx + 3*s*f, by - 10*s, 2, 7, '#304525');
  // Main body (Brunswick green — PRR standard)
  px(bx + 5*s*f, by - 11*s, 18, 9, '#2a4020');
  // Roof with pantographs
  px(bx + 5*s*f, by - 12*s, 18, 1, '#222');
  // Pantograph (raised for electric pickup)
  const pantY = by - 15*s + Math.sin(frameCount * 0.02) * s;
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bx + 10*s*f, by - 12*s);
  ctx.lineTo(bx + 12*s*f, pantY);
  ctx.lineTo(bx + 14*s*f, pantY);
  ctx.lineTo(bx + 16*s*f, by - 12*s);
  ctx.stroke();
  // Wire sparks (occasional)
  if (frameCount % 15 < 3) {
    dot(bx + 13*s*f, pantY - s, '#ffe066');
    dot(bx + 12*s*f, pantY - 2*s, '#fff');
  }
  // Gold pinstripes (Loewy's "cat whiskers")
  px(bx + 3*s*f, by - 7*s, 20, 1, '#c9a84c');
  px(bx + 3*s*f, by - 4*s, 20, 1, '#c9a84c');
  // Windows (cab at each end)
  px(bx + 4*s*f, by - 9*s, 2, 2, '#4a6fa5');
  px(bx + 20*s*f, by - 9*s, 2, 2, '#4a6fa5');
  // Center porthole windows
  for (let i = 0; i < 4; i++) {
    dot(bx + (8 + i*3)*s*f, by - 9*s, '#4a6fa5');
  }
  // PRR keystone herald
  dot(bx + 13*s*f, by - 6*s, '#cc2200');
  dot(bx + 14*s*f, by - 6*s, '#cc2200');
  // Running board
  px(bx + 3*s*f, by - 2*s, 20, 1, '#333');
  // Wheels (GG1 had 4-6-6-4 arrangement)
  for (let i = 0; i < 6; i++) {
    drawWheel(bx + (5 + i*3)*s*f, by);
  }

  return 24 * s;
}

// ── Classic 4-6-2 Pacific (Workhorse freight/passenger) ──
function drawPacific(bx, by, dir) {
  const s = PX, f = dir === 1 ? 1 : -1;

  // Boiler (traditional, not streamlined)
  px(bx + 4*s*f, by - 10*s, 12, 6, '#222');
  // Boiler bands (riveted look)
  for (let i = 0; i < 3; i++) {
    px(bx + (6 + i*4)*s*f, by - 10*s, 1, 6, '#333');
  }
  // Smokebox
  px(bx + 2*s*f, by - 10*s, 3, 6, '#1a1a1a');
  px(bx + 1*s*f, by - 9*s, 2, 4, '#111');
  // Smokestack (tall, flared)
  px(bx + 3*s*f, by - 14*s, 2, 4, '#222');
  px(bx + 2*s*f, by - 15*s, 4, 1, '#333');
  // Headlight
  dot(bx + 2*s*f, by - 12*s, '#ffe066');
  // Bell
  dot(bx + 5*s*f, by - 12*s, '#c9a84c');
  // Cab
  px(bx + 16*s*f, by - 12*s, 5, 8, '#6b3a2a');
  px(bx + 17*s*f, by - 11*s, 3, 3, '#4a6fa5');  // window
  px(bx + 15*s*f, by - 13*s, 7, 1, '#555');      // roof
  // Firebox glow
  px(bx + 14*s*f, by - 7*s, 2, 1, '#ff6600');
  if (frameCount % 10 < 5) dot(bx + 14*s*f, by - 8*s, '#ff440044');
  // Running boards
  px(bx + 1*s*f, by - 4*s, 20, 1, '#444');
  // Cow catcher
  px(bx, by - 2*s, 2, 2, '#555');
  // Wheels
  drawWheel(bx + 2*s*f, by);
  drawWheel(bx + 4*s*f, by);
  drawDriver(bx + 7*s*f, by, 0);
  drawDriver(bx + 10*s*f, by, 1);
  drawDriver(bx + 13*s*f, by, 2);
  drawWheel(bx + 18*s*f, by);
  // Connecting rod
  const rodP = Math.sin(frameCount * 0.08) * 1.5;
  ctx.strokeStyle = '#777';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bx + 7*s*f + rodP, by + s);
  ctx.lineTo(bx + 13*s*f + rodP, by + s);
  ctx.stroke();
  // Tender
  px(bx + 21*s*f, by - 10*s, 8, 7, '#222');
  px(bx + 22*s*f, by - 11*s, 6, 1, '#333');
  drawWheel(bx + 22*s*f, by);
  drawWheel(bx + 25*s*f, by);
  drawWheel(bx + 27*s*f, by);

  return 29 * s;
}

// ── Wheel helpers ───────────────────────────
function drawWheel(x, y) {
  const s = PX;
  ctx.fillStyle = '#444';
  ctx.fillRect(Math.round(x), Math.round(y), 2*s, 2*s);
  // Axle highlight
  dot(x + s*0.5, y + s*0.5, '#666');
}

function drawDriver(x, y, phase) {
  // Larger driving wheel with animated counterweight
  const s = PX;
  ctx.fillStyle = '#444';
  ctx.fillRect(Math.round(x), Math.round(y) - s, 3*s, 3*s);
  // Counterweight (rotates)
  const angle = frameCount * 0.08 + phase * 2.1;
  const cx = x + 1.5*s, cy = y + 0.5*s;
  dot(cx + Math.cos(angle)*s, cy + Math.sin(angle)*s, '#888');
  // Hub
  dot(cx, cy, '#555');
}

// ── Passenger Car (Pullman heavyweight, Art Deco era) ──
function drawPullmanCar(bx, by, variant) {
  const s = PX;
  const colors = [
    { body: '#1a3a5c', stripe: '#c9a84c', name: 'PULLMAN' },     // NYC blue
    { body: '#5c1a1a', stripe: '#c9a84c', name: 'DINING' },      // Tuscan red
    { body: '#2a4020', stripe: '#c9a84c', name: 'OBSERVATION' },  // PRR green
  ];
  const c = colors[variant % colors.length];

  // Body
  px(bx, by - 9*s, 20, 7, c.body);
  // Roof (clerestory style)
  px(bx + s, by - 10*s, 18, 1, '#2d2d2d');
  px(bx + 3*s, by - 11*s, 14, 1, '#333');
  // Gold letterboard
  px(bx, by - 5*s, 20, 1, c.stripe);
  // Windows (evenly spaced, Pullman pattern)
  for (let i = 0; i < 7; i++) {
    px(bx + (2 + i*2.5)*s, by - 8*s, 1.5, 2, '#5b8fb9');
  }
  // Vestibule doors
  px(bx + s, by - 8*s, 1, 4, '#0f2840');
  px(bx + 18*s, by - 8*s, 1, 4, '#0f2840');
  // Underbody
  px(bx, by - 2*s, 20, 1, '#111');
  // Trucks

function drawRoundhouse(x, y) {
  const s = PX;

  // Main building (brick pattern)
  px(x, y - 22*s, 32, 20, '#3a2010');
  // Brick texture
  for (let row = 0; row < 10; row++) {
    for (let col = 0; col < 16; col++) {
      const brickX = x + col*2*s + (row % 2 ? s : 0);
      const brickY = y - 22*s + row*2*s;
      ctx.fillStyle = (col + row) % 3 === 0 ? '#4a2a15' : '#3a2010';
      ctx.fillRect(brickX, brickY, 2*s - 1, 2*s - 1);
    }
  }
  // Arched roof
  px(x - s, y - 24*s, 34, 2, '#2a1508');
  px(x + 2*s, y - 26*s, 28, 2, '#2a1508');
  px(x + 5*s, y - 27*s, 22, 1, '#2a1508');
  // Chimney
  px(x + 14*s, y - 31*s, 4, 5, '#333');
  px(x + 13*s, y - 32*s, 6, 1, '#444');
  // Three open bays
  for (let i = 0; i < 3; i++) {
    px(x + (2 + i*10)*s, y - 16*s, 8, 14, '#0a0705');
    // Arch top
    px(x + (3 + i*10)*s, y - 17*s, 6, 1, '#5a3a20');
    px(x + (4 + i*10)*s, y - 18*s, 4, 1, '#5a3a20');
    // Rails going into bay
    ctx.strokeStyle = '#5a4838';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + (3 + i*10)*s, y - 2*s);
    ctx.lineTo(x + (3 + i*10)*s, y - 14*s);
    ctx.moveTo(x + (8 + i*10)*s, y - 2*s);
    ctx.lineTo(x + (8 + i*10)*s, y - 14*s);
    ctx.stroke();
  }
  // Windows above bays (with warm interior glow)
  for (let i = 0; i < 8; i++) {
    const winX = x + (2 + i*4)*s;
    px(winX, y - 21*s, 2, 2, '#ff990033');
    ctx.strokeStyle = '#5a3a20';
    ctx.lineWidth = 1;
    ctx.strokeRect(winX, y - 21*s, 2*s, 2*s);
  }
  // "ROUNDHOUSE" sign
  ctx.fillStyle = '#d29922';
  ctx.font = 'bold 10px Courier New';
  ctx.fillText('ROUNDHOUSE', x + 4*s, y - 23*s);

  // ── Turntable ──
  const tcx = x + 16*s, tcy = y + 8*s, tr = 12*s;
  // Pit
  ctx.strokeStyle = '#3a2a18';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(tcx, tcy, tr, 0, Math.PI * 2);
  ctx.stroke();
  // Rail ring
  ctx.strokeStyle = '#5a483866';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(tcx, tcy, tr - 2, 0, Math.PI * 2);
  ctx.stroke();
  // Bridge (rotating)
  const angle = frameCount * 0.006;
  ctx.strokeStyle = '#6b5344';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(tcx - Math.cos(angle)*tr, tcy - Math.sin(angle)*tr);
  ctx.lineTo(tcx + Math.cos(angle)*tr, tcy + Math.sin(angle)*tr);
  ctx.stroke();
  // Rails on bridge
  ctx.strokeStyle = '#5a4838';
  ctx.lineWidth = 1;
  const rOffset = 2;
  ctx.beginPath();
  ctx.moveTo(tcx - Math.cos(angle)*tr + Math.sin(angle)*rOffset, tcy - Math.sin(angle)*tr - Math.cos(angle)*rOffset);
  ctx.lineTo(tcx + Math.cos(angle)*tr + Math.sin(angle)*rOffset, tcy + Math.sin(angle)*tr - Math.cos(angle)*rOffset);
  ctx.moveTo(tcx - Math.cos(angle)*tr - Math.sin(angle)*rOffset, tcy - Math.sin(angle)*tr + Math.cos(angle)*rOffset);
  ctx.lineTo(tcx + Math.cos(angle)*tr - Math.sin(angle)*rOffset, tcy + Math.sin(angle)*tr + Math.cos(angle)*rOffset);
  ctx.stroke();
  // Center pivot
  ctx.fillStyle = '#666';
  ctx.beginPath();
  ctx.arc(tcx, tcy, 3, 0, Math.PI * 2);
  ctx.fill();
}

//  WEATHER EFFECTS RENDERING
// ══════════════════════════════════════════════

let raindrops = [];
let snowflakes = [];

function renderWeatherEffects() {
  const code = weather.code;

  // Rain (codes 51-67, 80-82, 95-99)
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) {
    const intensity = code >= 65 || code >= 82 || code >= 95 ? 8 : code >= 53 ? 4 : 2;
    for (let i = 0; i < intensity; i++) {
      raindrops.push({ x: Math.random() * W, y: -5, speed: 4 + Math.random() * 3 });
    }
    ctx.strokeStyle = '#5b8fb944';
    ctx.lineWidth = 1;
    for (let i = raindrops.length - 1; i >= 0; i--) {
      const r = raindrops[i];
      r.y += r.speed;
      r.x -= 1;
      ctx.beginPath();
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x + 1, r.y + 6);
      ctx.stroke();
      if (r.y > H) raindrops.splice(i, 1);
    }
    // Keep array bounded
    if (raindrops.length > 500) raindrops.splice(0, 200);
  }

  // Snow (codes 71-77, 85-86)
  if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) {
    const intensity = code >= 75 || code >= 86 ? 5 : 2;
    for (let i = 0; i < intensity; i++) {
      snowflakes.push({
        x: Math.random() * W, y: -5,
        speed: 0.5 + Math.random() * 1.5,
        drift: (Math.random() - 0.5) * 0.5,
        size: 1 + Math.random() * 2,
      });
    }
    ctx.fillStyle = '#ffffff88';
    for (let i = snowflakes.length - 1; i >= 0; i--) {
      const s = snowflakes[i];
      s.y += s.speed;
      s.x += s.drift + Math.sin(frameCount * 0.01 + i) * 0.3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
      if (s.y > H) snowflakes.splice(i, 1);
    }
    if (snowflakes.length > 400) snowflakes.splice(0, 150);
  }

  // Fog (codes 45, 48)
  if (code === 45 || code === 48) {
    ctx.fillStyle = '#c8d6e510';
    for (let i = 0; i < 5; i++) {
      const fogY = H * 0.3 + Math.sin(frameCount * 0.003 + i * 2) * 40;
      ctx.fillRect(0, fogY, W, 60);
    }
  }

  // Thunderstorm flash (codes 95-99)
  if (code >= 95 && frameCount % 200 < 3) {
    ctx.fillStyle = '#ffffff15';
    ctx.fillRect(0, 0, W, H);
  }

  // Overcast dimming (code 3)
  if (code === 3) {
    ctx.fillStyle = '#00000020';
    ctx.fillRect(0, 0, W, H);
  }

  // Night dimming
  if (!weather.isDay) {
    ctx.fillStyle = '#000000' + (code >= 3 ? '40' : '25');
    ctx.fillRect(0, 0, W, H);
  }
}

function drawTrack(y, width) {
  const s = PX;
  // Ballast bed
  ctx.fillStyle = '#2a2520';
  ctx.fillRect(0, y - 2*s, width, 10*s);
  // Rails (steel)
  ctx.fillStyle = '#6a5848';
  ctx.fillRect(0, y, width, s);
  ctx.fillRect(0, y + 5*s, width, s);
  // Rail highlight (top)
  ctx.fillStyle = '#8a7868';
  ctx.fillRect(0, y, width, 1);
  ctx.fillRect(0, y + 5*s, width, 1);
  // Ties (wooden)
  ctx.fillStyle = '#5a4430';
  for (let x = 0; x < width; x += 8 * s) {
    ctx.fillRect(x, y - s, 2*s, 7*s);
    // Tie plate
    ctx.fillStyle = '#444';
    ctx.fillRect(x + 0.5*s, y - 0.5*s, s, s);
    ctx.fillRect(x + 0.5*s, y + 5*s, s, s);
    ctx.fillStyle = '#5a4430';
  }
}

function drawGround() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  if (weather.isDay) {
    grad.addColorStop(0, '#1e2318');
    grad.addColorStop(0.3, '#1a1f16');
    grad.addColorStop(1, '#141810');
  } else {
    grad.addColorStop(0, '#0a0d08');
    grad.addColorStop(1, '#060806');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Sky strip at top
  const skyGrad = ctx.createLinearGradient(0, 0, 0, 50);
  if (weather.isDay) {
    skyGrad.addColorStop(0, weather.code >= 3 ? '#2a2a30' : '#1a2a3a');
    skyGrad.addColorStop(1, 'transparent');
  } else {
    skyGrad.addColorStop(0, '#08080a');
    skyGrad.addColorStop(1, 'transparent');
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, 60);
}

// ── Particle System (Steam/Smoke) ───────────
function addSteamParticle(x, y, color) {
  particles.push({
    x, y, vx: (Math.random() - 0.3) * 0.8, vy: -0.5 - Math.random() * 0.5,
    life: 1, decay: 0.008 + Math.random() * 0.01,
    size: 3 + Math.random() * 4, color: color || '#c8d6e5',
  });
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    p.size += 0.1;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life * 0.4;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const FALLBACK_CONSISTS = [
  { consist: ['pacific', 'pullman', 'boxcar', 'caboose'], label: 'LOCAL SERVICE' },
  { consist: ['hudson', 'pullman', 'pullman'], label: 'THROUGH TRAIN' },
  { consist: ['gg1', 'pullman', 'observation'], label: 'REGIONAL' },
  { consist: ['pacific', 'boxcar', 'tankcar', 'caboose'], label: 'MIXED FREIGHT' },
  { consist: ['hudson', 'diningcar', 'pullman', 'observation'], label: 'DELUXE SERVICE' },
];

// Deterministic hash so each contact always gets the same fallback
function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

class Train {
  constructor(trackIndex, direction, type, label, contactId) {
    this.trackIndex = trackIndex;
    this.direction = direction;
    this.type = type;
    this.label = label || '';
    this.contactId = contactId || '';
    this.speed = 0.4 + Math.random() * 0.6;
    this.dir = direction === 'arriving' ? 1 : -1;
    this.x = direction === 'arriving' ? -150 : W + 150;
    this.targetX = null;
    this.arrived = false;
    this.age = 0;
    this.opacity = 1;
    this.fadeOut = false;
    this.consist = this._buildConsist();
  }

  _buildConsist() {
    // Match contact against semantic rules
    const searchText = this.label + ' ' + this.contactId + ' ' + this.type;
    for (const rule of CONTACT_TRAIN_RULES) {
      if (rule.pattern.test(searchText)) {
        this.label = rule.label;
        return rule.consist;
      }
    }
    // Deterministic fallback based on contact identity
    const idx = hashString(this.contactId || this.label) % FALLBACK_CONSISTS.length;
    const fb = FALLBACK_CONSISTS[idx];
    if (!this.label || this.label === this.contactId) {
      this.label = fb.label;
    }
    return fb.consist;
  }

  getTrackY() {
    const spacing = Math.min(70, (H - 100) / Math.max(tracks.length, 3));
    return 60 + this.trackIndex * spacing;
  }

  update() {
    this.age++;
    if (this.direction === 'arriving') {
      this.x += this.speed;
      if (this.targetX !== null && this.x >= this.targetX) {
        this.x = this.targetX;
        this.arrived = true;
        this.speed = 0;
      } else if (this.x > W * 0.4 && this.targetX === null) {
        this.targetX = W * 0.25 + Math.random() * W * 0.25;
      }
    } else {
      this.x -= this.speed;
      if (this.x < -200) { this.fadeOut = true; }
    }
    if (this.fadeOut) this.opacity -= 0.015;

    // Steam from moving trains
    if (this.speed > 0 && frameCount % 4 === 0) {
      const y = this.getTrackY();
      const smokeX = this.direction === 'arriving' ? this.x + 30 : this.x + 60;
      addSteamParticle(smokeX, y - 45, this.type === 'gg1' ? '#ffe06644' : '#c8d6e5');
    }

    return this.opacity > 0;
  }

  draw() {
    const y = this.getTrackY();
    ctx.globalAlpha = this.opacity;

    let drawX = this.x;
    for (const car of this.consist) {
      let carWidth = 0;
      switch (car) {
        case 'hudson':           carWidth = drawHudson(drawX, y, this.dir); break;
        case 'zephyr':           carWidth = drawZephyr(drawX, y, this.dir); break;
        case 'gg1':              carWidth = drawGG1(drawX, y, this.dir); break;
        case 'pacific':          carWidth = drawPacific(drawX, y, this.dir); break;
        case 'pullman':          carWidth = drawPullmanCar(drawX, y, this.consist.indexOf(car)); break;
        case 'boxcar':           carWidth = drawBoxCar(drawX, y); break;
        case 'tankcar':          carWidth = drawTankCar(drawX, y); break;
        case 'mailcar':          carWidth = drawMailCar(drawX, y); break;
        case 'constructionflat': carWidth = drawConstructionFlat(drawX, y); break;
        case 'caboose':          carWidth = drawCaboose(drawX, y); break;
        case 'diningcar':        carWidth = drawDiningCar(drawX, y); break;
        case 'observation':      carWidth = drawObservationCar(drawX, y); break;
        case 'reefercar':        carWidth = drawReeferCar(drawX, y); break;
        default:                 carWidth = drawPacific(drawX, y, this.dir);
      }
      drawX += carWidth + 3; // coupling gap
    }

    // Label
    if (this.label) {
      ctx.fillStyle = '#e6edf3';
      ctx.font = 'bold 10px Courier New';
      ctx.globalAlpha = this.opacity * 0.7;
      ctx.fillText(this.label, this.x + 5, y - 50);
    }
    ctx.globalAlpha = 1;
  }
}

// ══════════════════════════════════════════════
//  MAIN RENDER LOOP
// ══════════════════════════════════════════════

function render() {
  frameCount++;
  ctx.clearRect(0, 0, W, H);
  drawGround();

  const numTracks = Math.max(tracks.length, 1);
  const spacing = Math.min(70, (H - 100) / Math.max(numTracks, 3));

  // Draw tracks
  for (let i = 0; i < numTracks; i++) {
    const y = 60 + i * spacing;
    drawTrack(y, W);

    // Track labels
    if (tracks[i]) {
      ctx.fillStyle = '#8b949e';
      ctx.font = 'bold 11px Courier New';
      const name = (tracks[i].display_name || tracks[i].identifier || '').substring(0, 24);
      ctx.fillText(name, 10, y - 12);
      // Message count
      ctx.fillStyle = '#30363d';
      const ct = String(tracks[i].message_count || 0);
      ctx.fillRect(10, y + 14, ctx.measureText(ct).width + 8, 14);
      ctx.fillStyle = '#8b949e';
      ctx.font = '9px Courier New';
      ctx.fillText(ct + ' msgs', 14, y + 24);
    }
  }

  // Roundhouse (bottom-right)
  if (H > 150) {
    drawRoundhouse(W - 140, H - 40);
  }

  // Update trains
  trainAnimations = trainAnimations.filter(t => t.update());
  for (const t of trainAnimations) t.draw();

  // Particles
  updateParticles();

  // Weather effects (on top of everything)
  renderWeatherEffects();

  // Roundhouse chimney smoke
  if (frameCount % 6 === 0) {
    addSteamParticle(W - 140 + 16 * PX, H - 40 - 32 * PX, '#55555588');
  }

  requestAnimationFrame(render);
}

// ══════════════════════════════════════════════
//  DATA FETCHING & DOM UPDATES (no innerHTML)
// ══════════════════════════════════════════════

let prevTrackIds = new Set();

async function fetchData() {
  try {
    const [tracksRes, scheduleRes, maintRes] = await Promise.all([
      fetch('/api/yard/tracks').then(r => r.json()),
      fetch('/api/yard/schedule').then(r => r.json()),
      fetch('/api/yard/maintenance').then(r => r.json()),
    ]);

    const newIds = new Set(tracksRes.map(t => t.id));
    for (const t of tracksRes) {
      if (!prevTrackIds.has(t.id) && prevTrackIds.size > 0) {
        spawnTrain(tracksRes.indexOf(t), 'arriving');
      }
    }
    prevTrackIds = newIds;

    tracks = tracksRes;
    schedule = scheduleRes;
    maintenance = maintRes;

    updateScheduleBoard();
    updateMaintenancePanel();
    updateStatusLights();
  } catch (e) {
    document.getElementById('light-api').className = 'light red';
  }
}

function spawnTrain(trackIndex, direction) {
  const t = tracks[trackIndex];
  const label = t ? (t.display_name || t.identifier || '') : '';
  const contactId = t ? (t.identifier || '') : '';
  // The Train constructor auto-classifies based on contact identity + message content
  const train = new Train(trackIndex, direction, 'auto', label, contactId);
  trainAnimations.push(train);
}

function spawnInitialTrains() {
  tracks.forEach((t, i) => {
    const dir = t.last_role === 'user' ? 'arriving' : 'departing';
    const label = t.display_name || t.identifier || '';
    const train = new Train(i, dir, 'auto', label, t.identifier || '');
    train.x = W * 0.2 + Math.random() * W * 0.3;
    train.speed = 0;
    train.arrived = true;
    trainAnimations.push(train);
  });
}

// Safe DOM schedule board update — no innerHTML
function updateScheduleBoard() {
  const tbody = document.getElementById('schedule-body');
  const empty = document.getElementById('schedule-empty');

  if (!schedule.length) {
    while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  while (tbody.firstChild) tbody.removeChild(tbody.firstChild);

  for (const s of schedule) {
    const tr = document.createElement('tr');

    const tdContact = document.createElement('td');
    const strong = document.createElement('strong');
    strong.textContent = s.contact;
    tdContact.appendChild(strong);

    const tdMsg = document.createElement('td');
    const flipMsg = document.createElement('span');
    flipMsg.className = 'flip-cell';
    flipMsg.textContent = s.last_message || '\u2014';
    tdMsg.appendChild(flipMsg);

    const tdDir = document.createElement('td');
    tdDir.className = s.direction === 'arriving' ? 'dir-arriving' : 'dir-departing';
    tdDir.textContent = (s.direction === 'arriving' ? '\u2192 ' : '\u2190 ') + s.direction;

    const tdTime = document.createElement('td');
    const flipTime = document.createElement('span');
    flipTime.className = 'flip-cell';
    flipTime.textContent = s.last_activity
      ? new Date(s.last_activity).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
      : '\u2014';
    tdTime.appendChild(flipTime);

    const tdCount = document.createElement('td');
    tdCount.textContent = s.message_count;

    tr.appendChild(tdContact);
    tr.appendChild(tdMsg);
    tr.appendChild(tdDir);
    tr.appendChild(tdTime);
    tr.appendChild(tdCount);
    tbody.appendChild(tr);
  }
}

// Safe DOM maintenance panel update — no innerHTML
function updateMaintenancePanel() {
  if (!maintenance.active_sessions) return;

  document.getElementById('stat-sessions').textContent = maintenance.active_sessions.length;
  document.getElementById('stat-pending').textContent = maintenance.pending_deliveries.length;
  document.getElementById('stat-messages').textContent = maintenance.total_messages;
  document.getElementById('stat-contacts').textContent = maintenance.total_contacts;

  const list = document.getElementById('session-list');
  while (list.firstChild) list.removeChild(list.firstChild);

  for (const s of maintenance.active_sessions) {
    const div = document.createElement('div');
    div.className = 'session-item';
    div.textContent = s.identifier + ' \u2014 session active';
    list.appendChild(div);
  }
  for (const p of maintenance.pending_deliveries) {
    const div = document.createElement('div');
    div.className = 'session-item pending-item';
    div.textContent = p.chat_identifier + ' \u2014 attempt ' + p.attempts + '/' + p.max_attempts;
    list.appendChild(div);
  }

  if (!maintenance.active_sessions.length && !maintenance.pending_deliveries.length) {
    const div = document.createElement('div');
    div.className = 'no-data';
    div.textContent = 'All quiet in the roundhouse';
    list.appendChild(div);
  }
}

function updateStatusLights() {
  document.getElementById('light-api').className = 'light green';
  document.getElementById('light-ai').className =
    maintenance.active_sessions && maintenance.active_sessions.length ? 'light green' : 'light off';
  document.getElementById('light-pending').className =
    maintenance.pending_deliveries && maintenance.pending_deliveries.length ? 'light yellow' : 'light off';
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
async function init() {
  await fetchData();
  spawnInitialTrains();
  render();
  setInterval(fetchData, 5000);
}
init();
</script>
